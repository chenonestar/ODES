{{template "head" .}}
<h1 class="text-xl font-bold mb-3">{{.P.Name}} · 统计</h1>
<div role="alert" class="alert alert-warning mb-4 items-start">
  <div><b>结果尚未开放</b>
    <div class="text-sm">测评进行中仅可查看提交进度，不可查看内容统计（FR-STA-020）。<br>
      结果开放时间：{{date .P.ResultOpenAt}}</div></div>
</div>
<div class="stats bg-base-100 border border-base-300">
  <div class="stat"><div class="stat-title">已提交</div>
    <div class="stat-value text-2xl" hx-get="/admin/projects/{{hex .P.ID}}/progress"
         hx-trigger="every 10s">{{.Submitted}}</div></div>
  <div class="stat"><div class="stat-title">应参加</div><div class="stat-value text-2xl">{{.P.ExpectedCount}}</div></div>
</div>
<div class="mt-4"><a class="btn btn-sm" href="/admin/projects/{{hex .P.ID}}">返回项目</a></div>
{{template "foot" .}}
