<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>{{.Title}}</title>
<style>{{.CSS}}</style>
</head>
<body class="bg-paper text-ink antialiased">

<!-- 题目数据一次性内嵌。此后翻页、填写、校验全部本地完成，
     直到提交才再次接触网络（ADR-001）。 -->
<script type="application/json" id="form-data">{{.FormJSON}}</script>

<div x-data="evalForm" x-cloak>

  <!-- 完成页（提交成功后就地切换，不再发请求） -->
  <template x-if="done">
    <div class="min-h-screen grid place-items-center px-6 text-center">
      <div>
        <div class="text-6xl text-green-700">&#10003;</div>
        <h2 class="text-xl font-semibold mt-3">提交成功，感谢参与</h2>
        <p class="text-slate mt-2 leading-relaxed" x-text="doneNote"></p>
      </div>
    </div>
  </template>

  <template x-if="notDone">
    <div>
      <div x-show="trial" class="bg-amber-600 text-white text-center py-2 text-sm font-semibold">
        试填模式 · 数据不计入统计
      </div>
      <div x-show="offline" class="bg-slate text-white text-center py-1.5 text-sm">
        当前网络不可用，已填内容不会丢失
      </div>

      <header class="bg-white border-b border-rule px-4 py-3 sticky top-0 z-10">
        <h1 class="font-semibold leading-snug" x-text="title"></h1>
        <p class="text-sm text-slate mt-0.5" x-text="intro"></p>
        <div class="flex items-center gap-2 mt-2 text-sm text-slate">
          <span x-text="posLabel"></span>
          <span class="flex-1"></span>
          <span>字号</span>
          <button type="button" class="border border-rule rounded px-2 py-0.5 text-sm"
                  x-on:click="fsSmall">小</button>
          <button type="button" class="border border-rule rounded px-2 py-0.5 text-sm"
                  x-on:click="fsMedium">中</button>
          <button type="button" class="border border-rule rounded px-2 py-0.5 text-sm"
                  x-on:click="fsLarge">大</button>
        </div>
        <div class="h-1 bg-rule/40 rounded mt-2 overflow-hidden">
          <div class="h-full bg-seal transition-all" x-bind:style="progressStyle"></div>
        </div>
      </header>

      <main class="px-4 pb-32 pt-3 max-w-2xl mx-auto" x-on:click="pick" x-on:input="typeText">
        <div class="bg-white border border-rule border-l-4 border-l-seal px-4 py-3 mb-3">
          <b class="text-lg" x-text="subjectName"></b>
          <span class="text-slate text-sm ml-2" x-text="subjectDuty"></span>
        </div>

        <template x-for="g in visibleGroups">
          <div>
            <div class="text-seal font-semibold mt-4 mb-2" x-text="g.title"></div>
            <template x-for="q in g.questions">
              <div class="bg-white border border-rule px-4 py-3 mb-3"
                   x-bind:id="q.domId" x-bind:class="q.missClass">
                <p class="font-semibold mb-2">
                  <span x-text="q.title"></span>
                  <span x-show="q.required" class="text-seal ml-0.5">*</span>
                </p>
                <p x-show="q.hint" class="text-sm text-slate -mt-1 mb-2" x-text="q.hint"></p>

                <!-- 选项整行可点，触摸目标 ≥48px；已选用填充色块而非细边框，
                     老花眼下细线难以分辨（HLD 9.4）。
                     刻意**不用真实的 <input type="radio">**：label 会把点击再转发给
                     内部控件，同一次点按会产生两个 click 事件，把刚选中的项立刻
                     取消掉。这里用 role="radio" + 样式化指示点，一次点按一个事件。 -->
                <div role="radiogroup">
                  <template x-for="o in q.choices">
                    <div role="radio" tabindex="0"
                         class="flex items-center gap-2.5 min-h-12 px-3 mb-1.5 rounded border cursor-pointer select-none"
                         x-bind:class="o.cls" x-bind:data-key="o.key"
                         x-bind:aria-checked="o.aria">
                      <span class="w-5 h-5 rounded-full border-2 grid place-items-center shrink-0"
                            x-bind:class="o.dotCls">
                        <span class="w-2.5 h-2.5 rounded-full bg-current" x-show="o.on"></span>
                      </span>
                      <span x-text="o.label"></span>
                    </div>
                  </template>
                </div>

                <template x-if="q.isText">
                  <div>
                    <textarea class="w-full min-h-24 p-2.5 border border-rule rounded text-base"
                              x-bind:maxlength="q.maxChars" x-bind:placeholder="q.hint"
                              x-bind:data-key="q.key"></textarea>
                    <div class="text-right text-xs text-slate" x-text="q.counter"></div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </main>

      <nav class="fixed inset-x-0 bottom-0 bg-white border-t border-rule flex gap-2 px-4 py-2.5 pb-[calc(0.625rem+env(safe-area-inset-bottom))]">
        <button type="button" class="flex-1 min-h-12 rounded border border-rule font-semibold"
                x-bind:disabled="atFirst" x-on:click="prev">‹ 上一位</button>
        <button type="button" class="flex-1 min-h-12 rounded bg-seal text-white font-semibold"
                x-bind:disabled="busy" x-on:click="next" x-text="nextLabel"></button>
      </nav>

      <div x-show="toast" class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2
                                 bg-ink/95 text-white px-6 py-4 rounded-md max-w-[80%] text-center z-50">
        <span x-text="toast"></span>
      </div>
    </div>
  </template>
</div>

<script>
// 组件定义必须在 Alpine 之前注册。用的是 Alpine 的 **CSP 构建**，
// 表达式只能是属性名或方法名——不需要 'unsafe-eval'，作答页因此可以
// 保持 default-src 'none' 的严格 CSP。所有派生值都写成 getter。
document.addEventListener("alpine:init", function () {
  Alpine.data("evalForm", function () {
    var D = JSON.parse(document.getElementById("form-data").textContent);
    var DRAFT = "draft:" + D.token, FS = "fs";
    var LS = (function () {
      try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return localStorage; }
      catch (e) { return null; }
    })();

    return {
      d: D, trial: D.trial, title: D.title, intro: D.intro,
      page: 0, ans: {}, miss: {}, done: false, busy: false, toast: "",
      offline: false, fs: 1, _blob: 0, sealed: false,

      init: function () {
        var self = this;
        // 草稿（FR-ANS-015）：按令牌分 key，同设备多人先后作答不串档
        if (LS) {
          try {
            var raw = LS.getItem(DRAFT);
            if (raw) { var o = JSON.parse(raw); if (o && o.a) this.ans = o.a; }
            for (var i = LS.length - 1; i >= 0; i--) {
              var k = LS.key(i);
              if (k && k.indexOf("draft:") === 0) {
                try {
                  var d = JSON.parse(LS.getItem(k));
                  if (!d || !d.t || Date.now() - d.t > 864e5) LS.removeItem(k);
                } catch (e) { LS.removeItem(k); }
              }
            }
            var f = LS.getItem(FS);
            if (f !== null) this.fs = +f;
          } catch (e) {}
        }
        this.applyFS();
        window.addEventListener("offline", function () { self.offline = true; });
        window.addEventListener("online", function () { self.offline = false; });
      },

      // ── 派生值（CSP 构建下模板里只能引用这些）──
      get notDone() { return !this.done; },
      get subject() { return this.d.subjects[this.page]; },
      get subjectName() { return this.subject.name; },
      get subjectDuty() { return this.subject.duty || ""; },
      get atFirst() { return this.page === 0; },
      get atLast() { return this.page === this.d.subjects.length - 1; },
      get nextLabel() { return this.atLast ? "提交测评" : "下一位 ›"; },
      get posLabel() {
        return "第 " + (this.page + 1) + " / " + this.d.subjects.length +
               " 位　已完成 " + this.answered + "/" + this.total;
      },
      get progressStyle() {
        return "width:" + (this.total ? this.answered * 100 / this.total : 0) + "%";
      },
      get doneNote() {
        return this.trial ? "这是试填模式，本次数据不计入统计。"
                          : "您的作答已匿名记录，无法与您的身份关联。请将令牌单投入会场出口回收箱。";
      },
      get total() {
        var n = 0;
        this.d.groups.forEach(function (g) {
          g.questions.forEach(function (q) { n += q.subjects.length; });
        });
        return n;
      },
      get answered() {
        var n = 0, a = this.ans;
        for (var k in a) {
          var v = a[k];
          if (v !== undefined && v !== null && v !== "" && !(Array.isArray(v) && !v.length)) n++;
        }
        return n;
      },

      // 当前页要渲染的题目，已展开成模板可直接消费的形状——
      // CSP 构建不允许在模板里做运算，因此全部预先算好。
      get visibleGroups() {
        var self = this, sid = this.subject.id, out = [];
        this._blob;
        this.d.groups.forEach(function (g) {
          var qs = [];
          g.questions.forEach(function (q) {
            if (q.subjects.indexOf(sid) < 0) return;
            var key = q.id + ":" + sid, v = self.ans[key];
            var item = {
              key: key, domId: "q-" + key.replace(/[^A-Za-z0-9_-]/g, "_"),
              title: q.title, hint: q.hint || "", required: !!q.required,
              isText: q.kind === "text", maxChars: q.maxChars || 500,
              missClass: self.miss[key] ? "border-seal ring-2 ring-seal/15" : "",
              counter: (v ? String(v).length : 0) + "/" + (q.maxChars || 500),
              choices: []
            };
            var add = function (val, label, muted) {
              var on = Array.isArray(v) ? v.indexOf(val) >= 0 : v === val;
              item.choices.push({
                key: key + "|" + q.kind + "|" + val, label: label, on: on,
                aria: on ? "true" : "false",
                cls: on ? (muted ? "bg-slate text-white border-slate font-semibold"
                                 : "bg-seal text-white border-seal font-semibold")
                        : "bg-white border-rule" + (muted ? " text-slate" : ""),
                dotCls: on ? "border-white text-white" : "border-rule text-transparent"
              });
            };
            if (q.kind === "grade") {
              self.d.grades.forEach(function (g2, i) { add(i, g2, false); });
              add(-1, "弃权", true);
            } else if (q.kind === "single") {
              q.options.forEach(function (o) { add(o.id, o.label, false); });
              add("__abstain", "弃权", true);
            } else if (q.kind === "multi") {
              q.options.forEach(function (o) { add(o.id, o.label, false); });
            } else if (q.kind === "score") {
              var lo = q.scoreMin || 1, hi = q.scoreMax || 10;
              for (var n = lo; n <= hi; n++) add(n, n + " 分", false);
            }
            qs.push(item);
          });
          if (qs.length) out.push({ title: g.title, questions: qs });
        });
        return out;
      },

      // ── 动作 ──
      // 事件委托：监听挂在 <main> 上，而不是每个 label 上。
      //
      // 必须这样做——Alpine 的 CSP 构建在嵌套 <template x-for> 内部的元素上
      // 绑定 x-on 不生效（同样的 x-on:click 写在 x-for 外的按钮上正常）。
      // 委托到 x-for 之外的容器既绕开了这个限制，也少了几百个监听器。
      pick: function (e) {
        var lab = e.target.closest ? e.target.closest("[data-key][role=radio]") : null;
        if (!lab) return;
        var parts = lab.dataset.key.split("|");
        var key = parts[0], kind = parts[1], raw = parts.slice(2).join("|");
        var val = (kind === "grade" || kind === "score") ? +raw : raw;
        if (kind === "multi") {
          var arr = this.ans[key] || [];
          var i = arr.indexOf(val);
          if (i >= 0) arr.splice(i, 1); else arr.push(val);
          this.ans[key] = arr.length ? arr : undefined;
        } else {
          this.ans[key] = this.ans[key] === val ? undefined : val;
        }
        delete this.miss[key];
        this._blob++;
        this.save();
      },

      typeText: function (e) {
        if (e.target.tagName !== "TEXTAREA" || !e.target.dataset.key) return;
        this.ans[e.target.dataset.key] = e.target.value || undefined;
        this._blob++;
        this.save();
      },

      prev: function () { if (this.page > 0) { this.page--; this.save(); window.scrollTo(0, 0); } },

      next: function () {
        var missing = this.missingOnPage();
        if (missing.length) {
          var self = this;
          missing.forEach(function (k) { self.miss[k] = 1; });
          this._blob++;
          this.flash("本页有必填项未完成，已为您定位到第一处");
          var el = document.getElementById("q-" + missing[0].replace(/[^A-Za-z0-9_-]/g, "_"));
          if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
          return;
        }
        if (!this.atLast) { this.page++; this.save(); window.scrollTo(0, 0); return; }
        if (!confirm("提交后将无法修改，确定提交？")) return;   // FR-ANS-017
        this.submit();
      },

      missingOnPage: function () {
        var sid = this.subject.id, self = this, out = [];
        this.d.groups.forEach(function (g) {
          g.questions.forEach(function (q) {
            if (!q.required || q.subjects.indexOf(sid) < 0) return;
            var k = q.id + ":" + sid, v = self.ans[k];
            if (v === undefined || v === null || v === "" ||
                (Array.isArray(v) && !v.length)) out.push(k);
          });
        });
        return out;
      },

      submit: function () {
        var self = this, items = [];
        this.d.groups.forEach(function (g) {
          g.questions.forEach(function (q) {
            q.subjects.forEach(function (sid) {
              var v = self.ans[q.id + ":" + sid];
              if (v === undefined || v === null || v === "") return;
              var it = { q: q.id, s: sid };
              if (q.kind === "grade") it.grade = v;
              else if (q.kind === "score") it.score = v;
              else if (q.kind === "multi") it.opts = v;
              else if (q.kind === "single") it.opt = v;
              else it.text = v;
              items.push(it);
            });
          });
        });
        this.busy = true;
        this.flash("正在提交…");
        fetch(this.d.submitURL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ v: 1, items: items })
        }).then(function (r) {
          return r.json().then(function (j) { return j; });
        }).then(function (j) {
          self.busy = false; self.toast = "";
          if (j && j.ok) {
            // 提交成功立即清除草稿（FR-ANS-016）。
            // 必须先取消待触发的防抖保存——否则那个 500ms 的定时器会在
            // removeItem 之后把草稿原样写回去，内容就留在了别人的手机上。
            self.sealed = true;
            clearTimeout(self._t);
            if (LS) { try { LS.removeItem(DRAFT); } catch (e) {} }
            self.done = true;
            window.scrollTo(0, 0);
            return;
          }
          if (j && j.missing && j.missing.length) {
            j.missing.forEach(function (k) { self.miss[k] = 1; });
            var sid = j.missing[0].split(":")[1];
            for (var i = 0; i < self.d.subjects.length; i++) {
              if (self.d.subjects[i].id === sid) { self.page = i; break; }
            }
            self._blob++;
          }
          self.flash((j && j.msg) || "提交失败，请重试", 3000);
        }).catch(function () {
          // 提交失败保留草稿并支持重试（FR-ANS-020）
          self.busy = false;
          self.flash("提交失败，请检查是否已连上测评 WiFi，然后重试。已填内容已保留。", 4000);
        });
      },

      save: function () {
        if (!LS || this.sealed) return;
        var self = this;
        clearTimeout(this._t);
        this._t = setTimeout(function () {           // 防抖 500ms
          try { LS.setItem(DRAFT, JSON.stringify({ t: Date.now(), a: self.ans })); } catch (e) {}
        }, 500);
      },

      flash: function (m, ms) {
        var self = this;
        this.toast = m;
        clearTimeout(this._ft);
        if (ms) this._ft = setTimeout(function () { self.toast = ""; }, ms);
      },

      // 字号三档，默认档 ≥17px（FR-ANS-021）
      fsSmall: function () { this.fs = 0; this.applyFS(); },
      fsMedium: function () { this.fs = 1; this.applyFS(); },
      fsLarge: function () { this.fs = 2; this.applyFS(); },
      applyFS: function () {
        document.documentElement.style.fontSize = ["16px", "19px", "22px"][this.fs];
        if (LS) { try { LS.setItem(FS, this.fs); } catch (e) {} }
      }
    };
  });
});
</script>
<script>{{.Alpine}}</script>
</body>
</html>
