# CI（LLD 附录 A.1「CI 强制检查」）
#
# 六项检查全部为**硬失败**，任一不通过即构建失败。这不是形式：
# 匿名性是本系统的核心承诺，而承诺若没有强制力，迟早会在某次"顺手加个
# 时间戳方便排查"的提交里失效。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: eval

jobs:
  # ① 匿名性三断言 + 全部测试
  test:
    name: 测试与匿名性断言
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: eval/go.sum

      - name: 匿名性三断言（AT-02）
        run: go test ./internal/store/ -run 'AT02|NoTimeColumn|ForeignKeys' -v

      - name: 时序不可还原（AT-01，含自增主键对照组）
        run: go test ./internal/store/ -run AT01 -v

      - name: 输出顺序随机（AT-03，含固定顺序对照组）
        run: go test ./internal/export/ -run AT03 -v

      - name: 日志洁净（AT-04）
        run: go test ./internal/service/ -run AT04 -v

      - name: DHCP 租约不落盘（AT-05）
        run: go test ./internal/netsvc/ -run AT05 -v

      - name: 擦除无残留（AT-06）
        run: go test ./internal/service/ -run AT06 -v

      - name: 口径恒等式穷举（ST-01）与分母口径（ST-02）
        run: go test ./internal/stats/ -run 'ST01|ST02' -v

      - name: 提交幂等（TX-01 / TX-02）
        run: go test ./internal/service/ -run 'TX01|TX02' -v

      - name: 架构约束（依赖方向 / Shuffle 覆盖 / 匿名区字段）
        run: go test ./internal/arch/ -v

      - name: 全部测试
        run: go test ./...

  # ② go vet + 竞态检测
  vet:
    name: vet 与竞态
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: eval/go.sum
      - run: go vet ./...
      - name: 竞态检测
        run: go test -race ./... -short

  # ③ CGO 检查 + 三平台交叉编译（CON-07 / NFR-POR-011）
  #
  # CON-07：数据库访问层不得引入 CGO，以保证三平台交叉编译与单文件分发。
  # 这条一旦破了，产品定位（单文件、拷贝即用）就没了。
  build:
    name: 交叉编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: eval/go.sum
      # 先整包编一遍，确认所有包在该平台下都编得过（含测试用不到的分支）
      - name: CGO_ENABLED=0 全包构建
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./...

      # 再单独产出可执行文件。
      #
      # -trimpath 去掉构建机的绝对路径，-buildvcs=false 不把仓库信息写进
      # 二进制：这个程序要拷到考察笔记本上运行，构建机的目录结构与提交号
      # 都不该跟着走。
      #
      # -s -w 去掉符号表与调试信息。字体已经占了 30MB，符号表再加十几兆
      # 没有意义——现场是 U 盘拷贝，体积就是拷贝时间。
      - name: 产出可执行文件
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BIN=eval
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN=eval.exe; fi
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o "dist/$BIN" ./cmd/eval
          ls -lh "dist/$BIN"

      # 一并带上现场需要的配套文件，免得拿到 exe 还要回仓库翻配置样例
      - name: 打包现场文件
        run: |
          cp config.example.toml dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.goos }}-${{ matrix.goarch }}
          path: eval/dist/
          retention-days: 30
          if-no-files-found: error

  # ④ 生成物是否最新
  #
  # sqlc 与 templ 的生成物提交进仓库，是为了让 go run 不需要工具链。
  # 代价是它们可能与源文件脱节——这一步就是防这个：重新生成后若有 diff，
  # 说明有人改了 .sql / .templ 却忘了提交生成物。
  generated:
    name: 生成物与源文件一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: eval/go.sum
      - name: 重新生成
        run: go generate ./...
      - name: 检查是否有未提交的生成物
        run: |
          if ! git diff --quiet; then
            echo "生成物与源文件不一致。请在本地执行 go generate ./... 并提交结果：" >&2
            git diff --stat >&2
            exit 1
          fi

  # ⑤ 设计稿与迁移脚本同步
  #
  # 仓库根目录的 schema_V1.0.sql 是设计稿（权威），
  # eval/migrations/00001_init.sql 是它加上 goose 标记后的副本。
  # 两者必须逐字节一致，否则文档与实现会悄悄分家。
  schema:
    name: 迁移脚本与设计稿同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: eval/go.sum
      - run: go test ./internal/store/ -run SchemaMatchesDesignDoc -v

  # ⑥ 浏览器端到端（LLD 11.2 的 UI-01 / UI-02 等）
  #
  # Go 测试守数据与不变量，这一层守"人在浏览器里真的能把流程走完"。
  # 两者不重叠：Go 测试全绿而作答页白屏是完全可能的，开发中这一层
  # 实测逮出过五个 Go 测试完全够不着的缺陷（见 test/e2e/README.md）。
  e2e:
    name: 浏览器端到端（UI-01 / UI-02）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: eval/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 只装 chromium：管理端与作答端的断言都只针对 Chromium 内核，
      # 多装 firefox/webkit 要多花几分钟而没有对应用例。
      #
      # 用全局装好的 playwright 命令而不是 npx：npx 在本地找不到时会自己
      # 再下载一份，装出来的位置与全局那份未必一致，排查起来很费劲。
      - name: 安装 Playwright 与 Chromium
        run: |
          npm i -g playwright
          playwright install --with-deps chromium

      # 套件是 run.js 派生的子进程。Node 默认不查全局 node_modules，
      # 所以显式把全局根传下去；lib.js 里另有 `npm root -g` 兜底。
      - name: 跑端到端套件
        run: node test/e2e/run.js
        env:
          NODE_PATH: /usr/local/lib/node_modules
