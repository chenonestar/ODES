# 线上民主测评系统 · 配置文件（LLD 12.2）
# 置于可执行文件同目录，随考察装备固化。文件不存在时按内置默认值运行。
# 复制为 config.toml 后按实际情况修改。

[network]
listen_ip  = "192.168.66.1"     # 本机静态地址，须与网卡实配一致
pool_start = "192.168.66.50"
pool_end   = "192.168.66.250"   # 201 个地址，覆盖单批 200 人
https_port = 8443
enable_dhcp = true              # 端口受限时置 false，改由外置路由分配
enable_dns  = true              # 不可轻易关闭：门户探测应答依赖它

[domain]
# 必须是考察部门自有域名。nip.io 一类公共通配 DNS 服务走不通——
# ACME 的三种验证方式全部堵死，详见 LLD 8.5 与 ADR-008。
primary     = "eval.example.gov.cn"   # 二维码 URL 与证书主名，驱动内置 DNS
alternate   = ""                      # 借用场地无线时的备用主机名，可空
short_entry = "e.example.gov.cn"      # 短码入口

[tls]
# file       = 装载 cert/key 指定的真实证书（正式测评必须）
# selfsigned = 自签名，仅供开发与连通性验证，手机会红屏
mode = "file"
cert = "cert/fullchain.pem"
key  = "cert/privkey.pem"

[session]
timeout_min = 30                # 现场监控场景可调至 240

[snapshot]
dir          = "snapshot"       # 可指向 U 盘
interval_min = 5                # 主机故障时最多损失这么多分钟的数据
